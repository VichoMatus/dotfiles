# Use software attenuation for BlackShark V2 Pro USB receivers whose hardware
# volume changes are reported but do not reliably change the perceived level.
# The receiver's physical wheel still sets its hardware listening level.
monitor.alsa.rules = [
  {
    matches = [
      {
        device.name = "~alsa_card.usb-1532_Razer_BlackShark_V2_Pro_2.4_.*"
      }
    ]
    actions = {
      update-props = {
        api.alsa.soft-mixer = true
      }
    }
  }
]
